# Oslat — full validation run.
#
# Creates a Pod on the cluster, waits for it to complete (or timeout), and
# writes its logs to oslat_logs.out under --artifacts-dir.
#
# Placeholder example — replace the Pod with your real workload. For OpenShift
# platform verification latency tests, use the image and Pod fields from:
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/scalability_and_performance/cnf-performing-platform-verification-latency-tests
# In disconnected environments, mirror the image to your local registry.
#
# Requires: --kubeconfig

oslat:
  timeout: 30m
  pod:
    metadata:
      name: oslat-validation
      # namespace: CHANGE_ME  # Uncomment to run in a specific namespace (default: cluster default)
    spec:
      restartPolicy: Never
      # nodeSelector:                         # Uncomment to pin to a specific node
      #   kubernetes.io/hostname: CHANGE_ME
      containers:
        - name: oslat
          image: CHANGE_ME  # Your container image (see Red Hat latency-test docs for platform verification)
          command: ["oslat"]
          args: ["-D", "1800"]  # Example: run oslat for 1800 seconds
          # resources:                         # Uncomment to set resource requests/limits
          #   requests:
          #     cpu: "4"
          #     memory: 1Gi
          #   limits:
          #     cpu: "4"
          #     memory: 1Gi
